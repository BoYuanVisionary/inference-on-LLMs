# three experiments with different random seeds for each model

# ─── W&B sweep spec ───────────────────────────────
program: /ssdscratch/byuan48/efficient_reasoning/reasoning/inference/majority.py                
method: grid                   # exhaustive over every combination
name: model‑vs‑seed            # appears in the UI
project: efficient_reasoning   # goes to the same W&B project
metric:
  name: accuracy               # ⬅ change to whatever you log
  goal: maximize

parameters:
  # —— 1. seeds to test ——
  seed:
    values: [0, 42, 123]

  # —— 2. candidate models ——
  model_name:
    values:
      - meta-llama/Llama-3.2-1B-Instruct
      - meta-llama/Llama-3.2-3B-Instruct
      - Qwen/Qwen2.5-7B-Instruct

command:                # how each run is launched
  - ${env}
  - python
  - ${program}
  - --config
  - b.yaml              # keep using your base config
  - ${args_no_hyphens}  # W&B appends "seed=…" "model_name=…"