# This is a base config for all the experiments on weighted majority voting. 
# Run 3 independent experiments with different seeds and num_return_sequences of 64

config_name: None

# System parameters
cuda_device_ids: [0, 1, 2, 3]
seed: None
# For temporarily bypass the memory leakage issue when generating too many tokens
begin_problem_index: 0 # index starts from 0
end_problem_index: 500 # index starts from 0

# Dataset and model parameters
data_path: HuggingFaceH4/MATH-500
model_name: None
reward_model_name: Qwen/Qwen2.5-Math-PRM-7B # default one
 
# Inference parameters
batch_size: 10
max_new_tokens: 2048
temperature: 0.7
top_p: 0.9

# weighted majority parameters
inference_method: weighted_majority # weighted_majority, best_of_N, majority
num_return_sequences: 64


# wandb parameters
wandb_project: efficient_reasoning

# reward method
ORM_type: product # min, last or product, geo_mean

system_prompt: |
    Solve the following math problem efficiently and clearly:
    
    - For simple problems (2 steps or fewer):
      Provide a concise solution with minimal explanation.
    
    - For complex problems (3 steps or more):
      Use this step-by-step format:
    
      ## Step 1: [Concise description]
      [Brief explanation and calculations]
    
      ## Step 2: [Concise description]
      [Brief explanation and calculations]
    
      ...
    
      Regardless of the approach, always conclude with:
    
      Therefore, the final answer is: $\boxed{answer}$. I hope it is correct.
    
      Where [answer] is just the final number or expression that solves the problem.

