config_name: Llama-3.2-3B-Instruct-samplingTree_4_1step_09

# System parameters
batch_size: 1
cuda_device_ids: [0, 1, 2, 3]
seed: 42

# Dataset and model parameters
data_path: HuggingFaceH4/MATH-500
model_name: meta-llama/Llama-3.2-3B-Instruct
# The folllowing is the default system prompt for llama-3.1-8b-instruct since its weak intrction following ability 
# and we have to enforce it to generate the correct format
 
system_prompt: |
  Solve the following reasoning problem, strictly following the instructions below:
  1. Show your reasoning step by step. Each step should start with "## Step X:"
  2. Put your final answer within \boxed{} at the end
# Inference parameters
max_new_tokens: 2048
temperature: 0.7
top_p: 0.9

# General parameters
experiment_name: samplingTree_experiment
inference_method: samplingTree
num_return_sequences: 1 # this is the number of generation for each selected step. Should be 1 for tree search


# wandb parameters
wandb_project: efficient_reasoning

# SamplingTree parameteres
sampling_method: stochastic_beam_search_version4
samplingTree_temperature: 0.1
beam_width: 4
max_steps: 2
threshold: 0.9

